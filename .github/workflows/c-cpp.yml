name: C++ Single File CI

on:
  push:
    branches:
      - main

jobs:
  compile-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install g++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Compile all .cpp files
        run: |
          find . -name "*.cpp" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file..."
            g++ -fsyntax-only "$file" || echo "Warning: $file has platform-specific code or syntax issue"
          done
          echo "All C++ (.cpp) files scan completed!"

