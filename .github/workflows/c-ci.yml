name: C Single File CI

on:
  push:
    branches:
      - main

jobs:
  compile-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install gcc compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compile all .c files
        run: |
          find . -name "*.c" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file..."
            gcc -fsyntax-only "$file" || echo "Warning: $file has platform-specific code or syntax issue"
          done
          echo "All C (.c) files scan completed!"
