services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: topup
      POSTGRES_USER: topup
      POSTGRES_PASSWORD: topup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  nats-data:
  postgres-data:
